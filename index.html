<style>
/* BASICS */

.CodeMirror {

  width: 0;

}

  100% {}
}

/* Can style cursor different in overwrite (non-insert) mode */

.cm-tab { display: inline-block; text-decoration: inherit; }

  overflow: hidden;

  border-left: 1px solid #ccc;
  top: 0; bottom: 0;
  position: absolute;

.cm-s-default .cm-header {color: blue;}
.cm-s-default .cm-quote {color: #090;}
.cm-negative {color: #d44;}
.cm-positive {color: #292;}
.cm-header, .cm-strong {font-weight: bold;}
.cm-em {font-style: italic;}
.cm-link {text-decoration: underline;}
.cm-strikethrough {text-decoration: line-through;}

.cm-s-default .cm-keyword {color: #708;}
.cm-s-default .cm-atom {color: #219;}
.cm-s-default .cm-number {color: #164;}
.cm-s-default .cm-def {color: #00f;}
.cm-s-default .cm-variable,
.cm-s-default .cm-punctuation,
.cm-s-default .cm-property,
.cm-s-default .cm-operator {}
.cm-s-default .cm-variable-2 {color: #05a;}
.cm-s-default .cm-variable-3, .cm-s-default .cm-type {color: #085;}
.cm-s-default .cm-comment {color: #a50;}
.cm-s-default .cm-string {color: #a11;}
.cm-s-default .cm-string-2 {color: #f50;}
.cm-s-default .cm-meta {color: #555;}
.cm-s-default .cm-qualifier {color: #555;}
.cm-s-default .cm-builtin {color: #30a;}
.cm-s-default .cm-bracket {color: #997;}
.cm-s-default .cm-tag {color: #170;}
.cm-s-default .cm-attribute {color: #00c;}
.cm-s-default .cm-hr {color: #999;}
.cm-s-default .cm-link {color: #00c;}

.cm-s-default .cm-error {color: #f00;}
.cm-invalidchar {color: #f00;}

.CodeMirror-composing { border-bottom: 2px solid; }

/* Default styles for common addons */

div.CodeMirror span.CodeMirror-matchingbracket {color: #0b0;}
div.CodeMirror span.CodeMirror-nonmatchingbracket {color: #a22;}
.CodeMirror-matchingtag { background: rgba(255, 150, 0, .3); }
.CodeMirror-activeline-background {background: #e8f2ff;}

/* STOP */

/* The rest of this file contains styles related to the mechanics of
   the editor. You probably shouldn't touch them. */

.CodeMirror {
  position: relative;
  overflow: hidden;
  background: white;
}

.CodeMirror-scroll {
  overflow: scroll !important; /* Things will break if this is overridden */
  /* 50px is the magic margin used to hide the element's real scrollbars */
  /* See overflow: hidden in .CodeMirror */
  margin-bottom: -50px; margin-right: -50px;
  padding-bottom: 50px;
  height: 100%;
  outline: none; /* Prevent dragging from highlighting the element */
  position: relative;
  z-index: 0;
}
.CodeMirror-sizer {
  position: relative;
  border-right: 50px solid transparent;
}

/* The fake, visible scrollbars. Used to force redraw during scrolling
   before actual scrolling happens, thus preventing shaking and
   flickering artifacts. */
.CodeMirror-vscrollbar, .CodeMirror-hscrollbar, .CodeMirror-scrollbar-filler, .CodeMirror-gutter-filler {
  position: absolute;
  z-index: 6;
  display: none;
  outline: none;
}
.CodeMirror-vscrollbar {
  right: 0; top: 0;
  overflow-x: hidden;
  overflow-y: scroll;
}
.CodeMirror-hscrollbar {
  bottom: 0; left: 0;
  overflow-y: hidden;
  overflow-x: scroll;
}
.CodeMirror-scrollbar-filler {
  right: 0; bottom: 0;
}
.CodeMirror-gutter-filler {
  left: 0; bottom: 0;
}

.CodeMirror-gutters {
  position: absolute; left: 0; top: 0;
  min-height: 100%;
  z-index: 3;
}
.CodeMirror-gutter {
  white-space: normal;
  height: 100%;
  display: inline-block;
  vertical-align: top;
  margin-bottom: -50px;
}
.CodeMirror-gutter-wrapper {
  position: absolute;
  z-index: 4;
  background: none !important;
  border: none !important;
}
.CodeMirror-gutter-background {
  position: absolute;
  top: 0; bottom: 0;
  z-index: 4;
}
.CodeMirror-gutter-elt {
  position: absolute;
  cursor: default;
  z-index: 4;
}
.CodeMirror-gutter-wrapper ::selection { background-color: transparent }
.CodeMirror-gutter-wrapper ::-moz-selection { background-color: transparent }

.CodeMirror-lines {
  cursor: text;
  min-height: 1px; /* prevents collapsing before first draw */
}
.CodeMirror pre.CodeMirror-line,
.CodeMirror pre.CodeMirror-line-like {
  /* Reset some styles that the rest of the page might have set */
  -moz-border-radius: 0; -webkit-border-radius: 0; border-radius: 0;
  border-width: 0;
  background: transparent;
  font-family: inherit;
  font-size: inherit;
  margin: 0;
  white-space: pre;
  word-wrap: normal;
  line-height: inherit;
  color: inherit;
  z-index: 2;
  position: relative;
  overflow: visible;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-variant-ligatures: contextual;
  font-variant-ligatures: contextual;
}
.CodeMirror-wrap pre.CodeMirror-line,
.CodeMirror-wrap pre.CodeMirror-line-like {
  word-wrap: break-word;
  white-space: pre-wrap;
  word-break: normal;
}

.CodeMirror-linebackground {
  position: absolute;
  left: 0; right: 0; top: 0; bottom: 0;
  z-index: 0;
}

.CodeMirror-linewidget {
  position: relative;
  z-index: 2;
  padding: 0.1px; /* Force widget margins to stay inside of the container */
}

.CodeMirror-widget {}

.CodeMirror-rtl pre { direction: rtl; }

.CodeMirror-code {
  outline: none;
}

/* Force content-box sizing for the elements where we expect it */
.CodeMirror-scroll,
.CodeMirror-sizer,
.CodeMirror-gutter,
.CodeMirror-gutters,
.CodeMirror-linenumber {
  -moz-box-sizing: content-box;
  box-sizing: content-box;
}

.CodeMirror-measure {
  position: absolute;
  width: 100%;
  height: 0;
  overflow: hidden;
  visibility: hidden;
}

.CodeMirror-cursor {
  position: absolute;
  pointer-events: none;
}
.CodeMirror-measure pre { position: static; }

div.CodeMirror-cursors {
  visibility: hidden;
  position: relative;
  z-index: 3;
}
div.CodeMirror-dragcursors {
  visibility: visible;
}

.CodeMirror-focused div.CodeMirror-cursors {
  visibility: visible;
}

.CodeMirror-selected { background: #d9d9d9; }
.CodeMirror-focused .CodeMirror-selected { background: #d7d4f0; }
.CodeMirror-crosshair { cursor: crosshair; }
.CodeMirror-line::selection, .CodeMirror-line > span::selection, .CodeMirror-line > span > span::selection { background: #d7d4f0; }
.CodeMirror-line::-moz-selection, .CodeMirror-line > span::-moz-selection, .CodeMirror-line > span > span::-moz-selection { background: #d7d4f0; }

.cm-searching {
  background-color: #ffa;
  background-color: rgba(255, 255, 0, .4);
}

/* Used to force a border model for a node */
.cm-force-border { padding-right: .1px; }

@media print {
  /* Hide the cursor when printing */
  .CodeMirror div.CodeMirror-cursors {
    visibility: hidden;
  }

.cm-tab-wrap-hack:after { content: ''; }

<style>
:root{
  --paper:#f6f3ec; --card:#fffdf8; --ink:#1f1d1a; --muted:#6b665d; --line:#e4dfd3; --soft:#efeadf;
  --accent:#0e6b62; --accent-ink:#fff; --accent-soft:#dcefe9; --hl:#c2410c; --hl-soft:#fbe7d8;
  --good:#2f7d32; --good-soft:#e3f1e2; --bad:#b42318; --bad-soft:#fbe4e1; --warn:#a15c07; --warn-soft:#fbefd9;
  --ed-bg:#1d1f24; --ed-gutter:#23262c; --ed-ink:#e6e1d6;
  --radius:14px; --shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -12px rgba(40,30,10,.18);
  --font:'Atkinson Hyperlegible',system-ui,sans-serif; --serif:'Fraunces',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme=dark]{
  --paper:#15161a; --card:#1c1e23; --ink:#ece7dc; --muted:#a39d91; --line:#2c2f36; --soft:#23262c;
  --accent:#4fb3a6; --accent-ink:#0b1a18; --accent-soft:#173430; --hl:#f08a4b; --hl-soft:#3a2416;
  --good:#6cc070; --good-soft:#1b2e1c; --bad:#f07a6e; --bad-soft:#3a1c19; --warn:#e7b05a; --warn-soft:#352a17;
  --ed-bg:#111216; --ed-gutter:#16171b; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
code,pre,kbd{font-family:var(--mono);font-size:.88em}
code{background:var(--soft);padding:.1em .35em;border-radius:5px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .35em;background:var(--card);font-size:.75em}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;letter-spacing:-.01em;margin:0 0 .4em}
h1{font-size:2rem} h2{font-size:1.4rem} h3{font-size:1.1rem}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.app>div{min-width:0}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:20px 14px;background:var(--card);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:14px}
.brand b{font-family:var(--serif);font-size:1.25rem}
.side h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 8px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:.95rem}
.nav:hover{background:var(--soft)} .nav.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .dot{width:10px;height:10px;border-radius:50%;flex:none}
.nav .pct{margin-left:auto;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .badge{margin-left:auto;background:var(--hl);color:#fff;border-radius:99px;font-size:.7rem;padding:0 7px;font-weight:700}
.side-foot{margin-top:auto;padding:12px 8px 0;font-size:.78rem;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)}
.main{min-width:0;padding:28px 36px 60px}
.mobile-top{display:none}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:10px;cursor:pointer;font-size:.92rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:4px 10px;font-size:.82rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.nav:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 10px;font-size:.75rem;font-weight:700;background:var(--soft);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
/* dashboard */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.hero .card h1{margin-bottom:.2em}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--serif);font-size:1.9rem;line-height:1}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring>div{width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1.1;font-size:.75rem;color:var(--muted)}
.ring b{display:block;font-family:var(--serif);font-size:1.3rem;color:var(--ink)}
.heat{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px}
.heat i{border-radius:3px;background:var(--soft)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--soft))} .heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--soft))} .heat i.l3{background:var(--accent)}
.track-card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);transition:transform .15s}
.track-card:hover{transform:translateY(-2px)}
.track-card .ti{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--mono);font-weight:600;font-size:.8rem}
.tip{border-left:4px solid var(--hl);background:var(--hl-soft);border-radius:10px;padding:12px 16px}
/* track page */
.lesson-list{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:14px;padding:14px 18px;text-decoration:none;color:var(--ink)}
.lrow:hover{border-color:var(--accent)}
.lnum{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.lrow.done .lnum{background:var(--good);border-color:var(--good);color:#fff}
.lrow.started .lnum{border-color:var(--accent);color:var(--accent)}
.langdots{display:flex;gap:4px}
.langdots span{font-family:var(--mono);font-size:.62rem;padding:0 5px;border-radius:5px;background:var(--soft);color:var(--muted)}
.langdots span.on{background:var(--good-soft);color:var(--good)}
/* lesson */
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted)}
.lesson{display:grid;grid-template-columns:minmax(340px,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.lesson-left{display:flex;flex-direction:column;gap:16px;min-width:0}
.lesson-right{position:sticky;top:16px;min-width:0}
.steps{display:flex;gap:6px;position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0;margin:-8px 0 0}
.step{flex:1;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:.82rem;cursor:pointer;color:var(--muted)}
.step b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:.72rem}
.step.done{color:var(--good);border-color:var(--good-soft)} .step.done b{background:var(--good);color:#fff}
.concept{min-width:0;overflow-wrap:anywhere}.concept p{margin:.6em 0}.card{min-width:0}
.concept pre.snippet{background:var(--ed-bg);color:var(--ed-ink);padding:14px 16px;border-radius:10px;overflow:auto;font-size:.82rem;line-height:1.55}
table.mini{border-collapse:collapse;width:100%;font-size:.88rem;margin:.6em 0}
table.mini th,table.mini td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.mini th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.keys{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.keys li{display:flex;gap:10px;align-items:flex-start}
.keys li::before{content:"";flex:none;width:8px;height:8px;margin-top:.55em;border-radius:2px;background:var(--hl);transform:rotate(45deg)}
.doclinks{display:flex;flex-wrap:wrap;gap:8px}
.doclink{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:.85rem;text-decoration:none;background:var(--card)}
.doclink:hover{border-color:var(--accent)}
.doclink::before{content:"📘"}
.q{margin-bottom:14px} .q:last-child{margin-bottom:0}
.q .qtext{font-weight:700;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:.75rem;color:var(--muted);padding-top:.2em}
.opt.right{background:var(--good-soft);border-color:var(--good)} .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--soft);font-size:.9rem}
.hint{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.92rem;background:var(--warn-soft)}
textarea.reflect{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}
/* workbench */
.wb{display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.wb-top{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:9px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:3px 9px;border-radius:7px;cursor:pointer;font-size:.8rem;font-family:var(--mono);color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button .ok{color:var(--good)}
.wb .CodeMirror{height:380px;font-family:var(--mono);font-size:13.5px;line-height:1.55;background:var(--ed-bg);color:var(--ed-ink)}
.wb.tall .CodeMirror{height:520px}
.wb-actions{display:flex;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.out{border-top:1px solid var(--line);max-height:330px;overflow:auto;font-family:var(--mono);font-size:.82rem;padding:10px 12px;white-space:pre-wrap;background:var(--paper);min-height:60px}
.out .pass{color:var(--good)} .out .fail{color:var(--bad)} .out .info{color:var(--muted)}
.out table{border-collapse:collapse;font-size:.8rem;white-space:nowrap}
.out th,.out td{border:1px solid var(--line);padding:3px 8px;text-align:left}
.out th{background:var(--soft)}
.banner{padding:10px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.good{background:var(--good-soft);color:var(--good)} .banner.bad{background:var(--bad-soft);color:var(--bad)} .banner.info{background:var(--accent-soft);color:var(--accent)}
.lens{border-top:1px solid var(--line);padding:10px 12px;font-size:.85rem}
.lens-head{display:flex;align-items:baseline;gap:4px 10px;margin-bottom:6px;flex-wrap:wrap}.lens-head b{white-space:nowrap}
.lens-list{display:flex;flex-wrap:wrap;gap:6px}
.lens-list a{font-family:var(--mono);font-size:.78rem;text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:2px 8px;background:var(--card)}
.lens-list a:hover,.lens-list a.focus{border-color:var(--accent);background:var(--accent-soft)}
.lens-focus{margin-bottom:8px;padding:8px 10px;border-radius:9px;background:var(--accent-soft);display:none}
.lens-focus.show{display:block}
.line-error{background:rgba(240,122,110,.16)}
.cm-doclink{text-decoration:underline dotted rgba(124,196,248,.7);text-underline-offset:3px;cursor:help}
.runbox{border-top:1px solid var(--line);padding:12px;font-size:.9rem;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.runbox textarea{width:100%;min-height:70px;font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);color:var(--ink)}
.preview{border-top:1px solid var(--line);background:#fff;color:#111;min-height:120px;padding:14px;font-family:system-ui,sans-serif}
.schema{border-top:1px solid var(--line);padding:10px 12px;font-size:.8rem;background:var(--paper)}
.schema div{margin:2px 0} .schema b{font-family:var(--mono)}
/* CodeMirror theme */
.cm-s-lab.CodeMirror{background:var(--ed-bg);color:var(--ed-ink)}
.cm-s-lab .CodeMirror-gutters{background:var(--ed-gutter);border-right:0}
.cm-s-lab .CodeMirror-linenumber{color:#5c6370}
.cm-s-lab .CodeMirror-cursor{border-left:2px solid #f0a36b}
.cm-s-lab .CodeMirror-activeline-background{background:rgba(255,255,255,.04)}
.cm-s-lab .CodeMirror-selected,.cm-s-lab.CodeMirror-focused .CodeMirror-selected{background:rgba(124,196,248,.18)}
.cm-s-lab .cm-keyword{color:#f0a36b} .cm-s-lab .cm-string,.cm-s-lab .cm-string-2{color:#a8d08d}
.cm-s-lab .cm-number,.cm-s-lab .cm-atom{color:#e5c07b} .cm-s-lab .cm-comment{color:#7d8590;font-style:italic}
.cm-s-lab .cm-def{color:#7cc4f8} .cm-s-lab .cm-builtin{color:#c792ea} .cm-s-lab .cm-type,.cm-s-lab .cm-variable-3{color:#56d4c1}
.cm-s-lab .cm-property{color:#d7c9a7} .cm-s-lab .cm-operator{color:#c8ccd4} .cm-s-lab .cm-tag{color:#f07178} .cm-s-lab .cm-attribute{color:#ffcb6b}
.cm-s-lab .cm-meta{color:#c792ea} .cm-s-lab .cm-variable-2{color:#e6e1d6} .cm-s-lab .cm-bracket{color:#9aa0a6}
.cm-s-lab .CodeMirror-matchingbracket{color:#fff!important;background:rgba(240,163,107,.3)}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,10,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{max-width:460px;width:100%}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.9rem;box-shadow:var(--shadow);animation:pop .25s ease-out}
.toast b{color:var(--hl)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.flash{animation:flash 1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--good)}100%{box-shadow:0 0 0 14px transparent}}
.review-card{max-width:680px;margin:0 auto}
.empty{text-align:center;padding:40px 20px}
.notes-item{margin-bottom:12px}
.notes-item p{white-space:pre-wrap;margin:.3em 0 0}

/* ---- accounts ---- */
body.auth-mode .side, body.auth-mode .mobile-top{display:none}
body.auth-mode .app{grid-template-columns:minmax(0,1fr)}
body.auth-mode .main{display:flex;justify-content:center;padding-top:36px}
.auth-wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px}
.auth-card{display:flex;flex-direction:column;gap:14px;padding:28px}
.auth-card h2{margin:0}
.auth-points{display:grid;gap:10px;text-align:left;margin:4px 0 6px}
.auth-points div{display:flex;flex-direction:column;background:var(--soft);border-radius:12px;padding:10px 14px}
.auth-points span{font-size:.9rem;color:var(--muted)}
.col-btns{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.col-btns .btn{justify-content:center}
.btn.big{padding:11px 18px;font-size:1rem;justify-content:center}
.field{display:flex;flex-direction:column;gap:5px;border:0;padding:0;margin:0;min-width:0}
.field>span,.field>legend{font-weight:700;font-size:.92rem;padding:0}
.field input,.field select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field input:focus,.field select:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.field input:disabled{background:var(--soft);color:var(--muted)}
.pw{display:flex;gap:6px;align-items:center}
.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{display:flex;flex-direction:column;gap:3px;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-size:.88rem}
.choice span{color:var(--muted)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.auth-msg{border-radius:10px;padding:10px 12px;font-size:.92rem}
.auth-msg.bad{background:var(--bad-soft);color:var(--bad)} .auth-msg.good{background:var(--good-soft);color:var(--good)}
.card.danger{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.sync.err i{background:var(--bad)}
/* ---- Simple mode cards ---- */
.sc{display:flex;flex-direction:column;gap:12px;outline:none;font-size:1.07rem;line-height:1.7}
.sc-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sc-dots{display:flex;gap:5px;flex-wrap:wrap}
.sc-dots i{width:9px;height:9px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.sc-dots i.seen{background:color-mix(in srgb,var(--accent) 45%,var(--soft));border-color:transparent}
.sc-dots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.sc-title{font-family:var(--serif);font-weight:700;font-size:1.4rem;line-height:1.25;display:flex;gap:10px;align-items:center}
.sc-emoji{font-size:1.6rem}
.sc-body p{margin:0 0 .6em}
.sc-body p:last-child{margin-bottom:0}
.sc pre.snippet{margin:0}
.think{background:var(--hl-soft);border-left:4px solid var(--hl);border-radius:10px;padding:10px 14px;font-size:.98rem}
.sc-nav{margin-top:4px}
.sc-nav .btn{padding:9px 18px}
@media (max-width:760px){.choice-row{grid-template-columns:1fr}.auth-card{padding:20px}}
@media (max-width:1100px){.lesson{grid-template-columns:minmax(0,1fr)}.lesson-right{position:static}.hero{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 30% 0 0;z-index:40;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .mobile-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:30}
  .main{padding:18px 14px 50px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .steps{overflow-x:auto} .step{flex:none}
  h1{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div>
    <div class="mobile-top"><button class="btn sm" id="menuBtn" aria-label="Open menu">☰</button><b style="font-family:var(--serif)">CodeLab</b></div>
    <main class="main" id="main"><p class="muted">Loading CodeLab…</p></main>
  </div>
</div>
