# CodeLab: static site, no build step. Deploy this folder as-is.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Only the CDN (editor, Python, SQL, React, TypeScript runtimes), Google Fonts and your Supabase project are allowed.
    # 'unsafe-inline' is needed for the React playground; 'wasm-unsafe-eval' for the Python and SQL engines.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cgkfwzyeismdinxgyxhl.supabase.co wss://cgkfwzyeismdinxgyxhl.supabase.co https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
